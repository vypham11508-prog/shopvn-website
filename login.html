<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập / Đăng ký – Pick&Pay</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    body { background: linear-gradient(135deg,#2C2C2C 40%,#FFB366 100%); min-height:100vh; }
    .auth-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
    .auth-outer { display:flex; gap:0; border-radius:20px; overflow:hidden; box-shadow:0 12px 48px rgba(0,0,0,0.3); max-width:780px; width:100%; }
    .auth-side { width:220px; background:linear-gradient(160deg,#2C2C2C,#444); color:white; padding:40px 24px; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; flex-shrink:0; }
    .auth-side .brand { font-family:'Montserrat',sans-serif; font-size:1.6rem; font-weight:800; color:#FFD54F; margin-bottom:10px; }
    .auth-side p { font-size:0.83rem; opacity:0.75; line-height:1.7; margin-bottom:20px; }
    .auth-side .mode-btns { display:flex; flex-direction:column; gap:10px; width:100%; }
    .mode-btn { padding:10px 14px; border-radius:10px; font-weight:700; font-size:0.86rem; cursor:pointer; border:2px solid transparent; font-family:'Montserrat',sans-serif; transition:all 0.2s; }
    .mode-btn.buyer { background:#FFD54F; color:#2C2C2C; }
    .mode-btn.seller { background:transparent; border-color:#FFB366; color:#FFB366; }
    .mode-btn.buyer.active { box-shadow:0 2px 10px rgba(255,213,79,0.5); }
    .mode-btn.seller.active { background:#FFB366; color:#2C2C2C; }
    .auth-card { background:white; flex:1; padding:36px 32px; }
    .auth-logo { font-size:1.4rem; font-weight:800; color:#2C2C2C; font-family:'Montserrat',sans-serif; margin-bottom:4px; }
    .auth-logo span { color:#FFB366; }
    .auth-sub { color:#888; font-size:0.85rem; margin-bottom:22px; }
    .auth-tabs { display:flex; margin-bottom:22px; border-bottom:2px solid #eee; }
    .auth-tab { flex:1; padding:9px; text-align:center; font-weight:700; font-size:0.9rem; cursor:pointer; color:#bbb; border-bottom:3px solid transparent; margin-bottom:-2px; font-family:'Montserrat',sans-serif; transition:all 0.2s; }
    .auth-tab.active { color:#2C2C2C; border-bottom-color:#FFB366; }
    .auth-panel { display:none; }
    .auth-panel.active { display:block; }
    .err-msg { color:#e53935; font-size:0.82rem; margin-bottom:9px; display:none; padding:8px 11px; background:#fce4ec; border-radius:8px; }
    .ok-msg { color:#2e7d32; font-size:0.82rem; margin-bottom:9px; display:none; padding:8px 11px; background:#e8f5e9; border-radius:8px; }
    .mode-label { display:inline-block; padding:3px 10px; border-radius:10px; font-size:0.75rem; font-weight:700; margin-bottom:14px; }
    .mode-label.buyer-label { background:#e3f2fd; color:#1565c0; }
    .mode-label.seller-label { background:#fff8e1; color:#e65100; }
    @media(max-width:600px){.auth-side{display:none;}.auth-outer{max-width:420px;}}
  </style>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-outer">
      <!-- SIDE PANEL -->
      <div class="auth-side">
        <div class="brand">🛒 Pick&Pay</div>
        <p>Mua sắm thả ga – Ưu đãi mỗi ngày. Hoặc mở gian hàng và kinh doanh ngay!</p>
        <div class="mode-btns">
          <button class="mode-btn buyer active" id="btn-buyer" onclick="setMode('buyer')">🛍️ Người mua</button>
          <button class="mode-btn seller" id="btn-seller" onclick="setMode('seller')">🏪 Người bán</button>
        </div>
        <div style="margin-top:20px;font-size:0.75rem;opacity:0.55;line-height:1.6;">Chọn vai trò trước khi đăng nhập hoặc đăng ký</div>
      </div>

      <!-- FORM PANEL -->
      <div class="auth-card">
        <div class="auth-logo">Pick<span>&</span>Pay</div>
        <div class="auth-sub" id="auth-sub-text">Chào mừng bạn đến với Pick&Pay</div>
        <div id="mode-indicator" class="mode-label buyer-label">👤 Người mua</div>

        <div class="auth-tabs">
          <div class="auth-tab active" onclick="switchTab('login')">Đăng nhập</div>
          <div class="auth-tab" onclick="switchTab('register')">Đăng ký</div>
        </div>

        <!-- ĐĂNG NHẬP -->
        <div class="auth-panel active" id="panel-login">
          <div class="err-msg" id="login-err"></div>
          <div class="form-group"><label>Email *</label><input type="email" id="login-email" placeholder="email@example.com" /></div>
          <div class="form-group"><label>Mật khẩu *</label><input type="password" id="login-pass" placeholder="Nhập mật khẩu..." /></div>
          <button class="btn-submit" style="margin-top:8px;" onclick="handleLogin()">Đăng nhập</button>
          <div style="text-align:center;margin-top:12px;font-size:0.83rem;color:#888;">
            Chưa có tài khoản? <a href="#" onclick="switchTab('register')" style="color:#FFB366;font-weight:700;">Đăng ký ngay</a>
          </div>
        </div>

        <!-- ĐĂNG KÝ NGƯỜI MUA -->
        <div class="auth-panel" id="panel-register">
          <div class="err-msg" id="reg-err"></div>
          <div class="ok-msg" id="reg-ok"></div>
          <div id="buyer-fields">
            <div class="form-group"><label>Họ và tên *</label><input type="text" id="reg-name" placeholder="Nguyễn Văn A" /></div>
            <div class="form-group"><label>Email *</label><input type="email" id="reg-email" placeholder="email@example.com" /></div>
            <div class="form-group">
              <label>Số điện thoại *</label>
              <input type="text" id="reg-phone" placeholder="0901234567" inputmode="numeric" oninput="this.value=this.value.replace(/\D/g,'')" maxlength="11" />
            </div>
            <div class="form-group"><label>Mật khẩu *</label><input type="password" id="reg-pass" placeholder="Ít nhất 6 ký tự" /></div>
            <div class="form-group"><label>Xác nhận mật khẩu *</label><input type="password" id="reg-pass2" placeholder="Nhập lại mật khẩu" /></div>
          </div>

          <!-- ĐĂNG KÝ NGƯỜI BÁN (ẩn mặc định) -->
          <div id="seller-fields" style="display:none;">
            <div class="form-group"><label>Họ và tên *</label><input type="text" id="s-name" placeholder="Nguyễn Văn A" /></div>
            <div class="form-group"><label>Email *</label><input type="email" id="s-email" placeholder="email@example.com" /></div>
            <div class="form-group">
              <label>Số điện thoại *</label>
              <input type="text" id="s-phone" placeholder="0901234567" inputmode="numeric" oninput="this.value=this.value.replace(/\D/g,'')" maxlength="11" />
            </div>
            <div class="form-group">
              <label>Số CCCD / CMND *</label>
              <input type="text" id="s-cccd" placeholder="012345678901" inputmode="numeric" oninput="this.value=this.value.replace(/\D/g,'')" maxlength="12" />
            </div>
            <div class="form-group"><label>Tên cửa hàng *</label><input type="text" id="s-shopname" placeholder="VD: Shop Thời Trang Vy" /></div>
            <div class="form-group">
              <label>Ngành hàng *</label>
              <select id="s-category">
                <option value="">Chọn ngành hàng</option>
                <option>Thời trang</option><option>Điện tử</option><option>Làm đẹp</option>
                <option>Sách</option><option>Thể thao</option><option>Thực phẩm</option>
              </select>
            </div>
            <div class="form-group"><label>Mật khẩu *</label><input type="password" id="s-pass" placeholder="Ít nhất 6 ký tự" /></div>
            <div class="form-group"><label>Xác nhận mật khẩu *</label><input type="password" id="s-pass2" placeholder="Nhập lại mật khẩu" /></div>
          </div>

          <button class="btn-submit" style="margin-top:8px;" onclick="handleRegister()">Đăng ký</button>
          <div style="text-align:center;margin-top:12px;font-size:0.83rem;color:#888;">
            Đã có tài khoản? <a href="#" onclick="switchTab('login')" style="color:#FFB366;font-weight:700;">Đăng nhập</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="auth.js"></script>
  <script src="data.js"></script>
  <script>
    let currentMode = 'buyer';

    function setMode(mode) {
      currentMode = mode;
      document.getElementById('btn-buyer').classList.toggle('active', mode==='buyer');
      document.getElementById('btn-seller').classList.toggle('active', mode==='seller');
      document.getElementById('buyer-fields').style.display = mode==='buyer' ? 'block' : 'none';
      document.getElementById('seller-fields').style.display = mode==='seller' ? 'block' : 'none';
      const ind = document.getElementById('mode-indicator');
      ind.className = 'mode-label ' + (mode==='buyer' ? 'buyer-label' : 'seller-label');
      ind.textContent = mode==='buyer' ? '👤 Người mua' : '🏪 Người bán';
      document.getElementById('auth-sub-text').textContent = mode==='buyer'
        ? 'Chào mừng bạn đến với Pick&Pay'
        : 'Mở gian hàng và bắt đầu kinh doanh';
    }

    function switchTab(tab) {
      document.querySelectorAll('.auth-tab').forEach((t,i) => t.classList.toggle('active',(i===0&&tab==='login')||(i===1&&tab==='register')));
      document.getElementById('panel-login').classList.toggle('active', tab==='login');
      document.getElementById('panel-register').classList.toggle('active', tab==='register');
    }

    function showErr(id, msg) { const e=document.getElementById(id); e.textContent=msg; e.style.display='block'; }
    function hideMsg(id) { document.getElementById(id).style.display='none'; }

    function handleLogin() {
      hideMsg('login-err');
      const email=document.getElementById('login-email').value.trim();
      const pass=document.getElementById('login-pass').value;
      if(!email||!pass){showErr('login-err','Vui lòng điền đầy đủ thông tin!');return;}
      const res=loginWithCredentials(email,pass);
      if(!res.ok){showErr('login-err',res.msg);return;}
      window.location.href = res.user.isSeller ? 'seller-dashboard.html' : 'index.html';
    }

    function handleRegister() {
      hideMsg('reg-err'); hideMsg('reg-ok');
      if (currentMode === 'buyer') {
        const name=document.getElementById('reg-name').value.trim();
        const email=document.getElementById('reg-email').value.trim();
        const phone=document.getElementById('reg-phone').value.trim();
        const pass=document.getElementById('reg-pass').value;
        const pass2=document.getElementById('reg-pass2').value;
        if(!name||!email||!phone||!pass){showErr('reg-err','Vui lòng điền đầy đủ thông tin!');return;}
        if(!/^\d{9,11}$/.test(phone)){showErr('reg-err','Số điện thoại không hợp lệ (9-11 chữ số)!');return;}
        if(pass.length<6){showErr('reg-err','Mật khẩu phải ít nhất 6 ký tự!');return;}
        if(pass!==pass2){showErr('reg-err','Mật khẩu xác nhận không khớp!');return;}
        const res=register(name,email,phone,pass);
        if(!res.ok){showErr('reg-err',res.msg);return;}
        const ok=document.getElementById('reg-ok'); ok.textContent='✅ Đăng ký thành công! Đang chuyển trang...'; ok.style.display='block';
        setTimeout(()=>window.location.href='index.html',1200);
      } else {
        const name=document.getElementById('s-name').value.trim();
        const email=document.getElementById('s-email').value.trim();
        const phone=document.getElementById('s-phone').value.trim();
        const cccd=document.getElementById('s-cccd').value.trim();
        const shopName=document.getElementById('s-shopname').value.trim();
        const category=document.getElementById('s-category').value;
        const pass=document.getElementById('s-pass').value;
        const pass2=document.getElementById('s-pass2').value;
        if(!name||!email||!phone||!cccd||!shopName||!category||!pass){showErr('reg-err','Vui lòng điền đầy đủ thông tin!');return;}
        if(!/^\d{9,11}$/.test(phone)){showErr('reg-err','Số điện thoại không hợp lệ!');return;}
        if(!/^\d{9,12}$/.test(cccd)){showErr('reg-err','Số CCCD/CMND không hợp lệ (9-12 chữ số)!');return;}
        if(pass.length<6){showErr('reg-err','Mật khẩu phải ít nhất 6 ký tự!');return;}
        if(pass!==pass2){showErr('reg-err','Mật khẩu xác nhận không khớp!');return;}
        const res=register(name,email,phone,pass);
        if(!res.ok){showErr('reg-err',res.msg);return;}
        // Thêm info người bán vào user
        const u=getUser(); u.shopName=shopName; u.category=category; u.isSeller=true; saveUser(u);
        // Cập nhật vào all_users
        const users=JSON.parse(localStorage.getItem('all_users')||'[]');
        const idx=users.findIndex(x=>x.email===email); if(idx>=0){users[idx]=u; localStorage.setItem('all_users',JSON.stringify(users));}
        const ok=document.getElementById('reg-ok'); ok.textContent='✅ Đăng ký gian hàng thành công!'; ok.style.display='block';
        setTimeout(()=>window.location.href='seller-success.html',1200);
      }
    }

    document.addEventListener('keydown',e=>{
      if(e.key!=='Enter')return;
      if(document.getElementById('panel-login').classList.contains('active'))handleLogin();
      else handleRegister();
    });
  </script>
</body>
</html>
