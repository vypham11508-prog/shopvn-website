<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập – ShopVN</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .login-wrapper { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #1f3864 60%, #FFB366 100%); padding: 20px; }
    .login-card { background: white; border-radius: 16px; padding: 40px; width: 100%; max-width: 420px; box-shadow: 0 8px 32px rgba(0,0,0,0.2); }
    .login-logo { text-align: center; font-size: 2rem; font-weight: 800; color: var(--dark); font-family: 'Montserrat', sans-serif; margin-bottom: 8px; }
    .login-sub { text-align: center; color: #888; font-size: 0.9rem; margin-bottom: 32px; }
    .login-tabs { display: flex; margin-bottom: 28px; border-bottom: 2px solid #eee; }
    .login-tab { flex: 1; padding: 10px; text-align: center; font-weight: 600; font-size: 0.9rem; cursor: pointer; color: #888; border-bottom: 3px solid transparent; margin-bottom: -2px; }
    .login-tab.active { color: var(--dark); border-bottom-color: var(--orange); }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-logo">🛍️ ShopVN</div>
      <div class="login-sub">Mua sắm online uy tín</div>

      <div class="login-tabs">
        <div class="login-tab active">Đăng nhập</div>
        <div class="login-tab">Đăng ký</div>
      </div>

      <div class="form-group">
        <label>Email hoặc Số điện thoại</label>
        <input type="text" placeholder="email@example.com hoặc 09xx..." />
      </div>
      <div class="form-group">
        <label>Mật khẩu</label>
        <input type="password" placeholder="Nhập mật khẩu..." />
      </div>
      <div style="text-align:right; margin-bottom:20px;">
        <a href="#" style="font-size:0.85rem; color:var(--orange);">Quên mật khẩu?</a>
      </div>
      <button class="btn-submit" onclick="window.location='index.html'">Đăng nhập</button>
      <div style="text-align:center; margin-top:16px; font-size:0.85rem; color:#888;">
        Hoặc đăng nhập với
      </div>
      <div style="display:flex; gap:12px; margin-top:12px;">
        <button style="flex:1; padding:10px; border:1px solid #ddd; border-radius:8px; background:white; cursor:pointer; font-size:0.88rem;">🔵 Facebook</button>
        <button style="flex:1; padding:10px; border:1px solid #ddd; border-radius:8px; background:white; cursor:pointer; font-size:0.88rem;">🔴 Google</button>
      </div>
      <div style="text-align:center; margin-top:20px; font-size:0.85rem;">
        Muốn bán hàng? <a href="seller-register.html" style="color:var(--orange); font-weight:600;">Đăng ký ngay →</a>
      </div>
    </div>
  </div>
</body>
</html>
