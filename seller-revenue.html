<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Doanh thu – Pick&Pay Seller</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="seller-header">
    <div class="shop-name">🏪 <span id="shop-name-display">Pick&amp;Pay Shop</span></div>
    <div style="display:flex;align-items:center;gap:14px;"><a href="index.html" style="color:var(--yellow);font-size:0.84rem;">← Về trang mua sắm</a></div>
  </div>
  <nav class="seller-nav">
    <a href="seller-dashboard.html">📊 Tổng quan</a>
    <a href="seller-products.html">📦 Sản phẩm</a>
    <a href="seller-orders.html">🛒 Đơn hàng</a>
    <a href="seller-revenue.html" class="active">💰 Doanh thu</a>
    <a href="seller-reviews.html">⭐ Đánh giá</a>
  </nav>

  <div class="container seller-content">
    <h2 style="font-size:1.2rem;color:var(--dark);margin-bottom:18px;">💰 Báo cáo doanh thu</h2>

    <div class="tab-bar">
      <button class="tab-btn active" onclick="setTab('week',this)">📅 Theo tuần</button>
      <button class="tab-btn" onclick="setTab('month',this)">🗓️ Theo tháng</button>
      <button class="tab-btn" onclick="setTab('year',this)">📆 Theo năm</button>
    </div>

    <!-- SUMMARY CARDS -->
    <div class="stats-grid" style="margin-bottom:24px;" id="summary-cards"></div>

    <div class="chart-card">
      <h3 id="chart-title">📈 Doanh thu 7 ngày gần nhất</h3>
      <canvas id="revenueChart" height="90"></canvas>
    </div>

    <!-- CHI TIẾT ĐƠN HOÀN THÀNH -->
    <div class="new-orders-table">
      <h3 id="table-title">Đơn hàng hoàn tất trong kỳ</h3>
      <div class="table-wrap"><table>
        <thead><tr><th>Mã đơn</th><th>Khách hàng</th><th>Sản phẩm</th><th>Doanh thu</th><th>Ngày</th></tr></thead>
        <tbody id="rev-tbody"></tbody>
      </table></div>
    </div>
  </div>

  <script src="auth.js"></script>
  <script src="data.js"></script>
  <script src="seller-data.js"></script>
  <script>
    const user = getUser();
    if (user) document.getElementById('shop-name-display').textContent = user.shopName||'Pick&Pay Shop';

    let chart = null;
    const today = new Date();

    function dDay(n) { const d=new Date(today); d.setDate(today.getDate()-n); return d; }

    function parseVNDate(str) { const p=str.split('/'); return new Date(parseInt(p[2]),parseInt(p[1])-1,parseInt(p[0])); }

    function setTab(tab, btn) {
      document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active');
      renderRevenue(tab);
    }

    function renderRevenue(tab) {
      const orders = getSellerOrders().filter(o=>o.status==='delivered');
      let labels=[], realData=[], title='', tableTitle='';
      const extraBase = [45,38,52,41,60,35,48,55,43,39,62,50];

      if (tab==='week') {
        title='📈 Doanh thu 7 ngày gần nhất'; tableTitle='Đơn hoàn tất 7 ngày qua';
        for(let i=6;i>=0;i--){
          const d=dDay(i);
          labels.push(`${d.getDate()}/${d.getMonth()+1}`);
          const dayOrders = orders.filter(o=>{const od=parseVNDate(o.date);return od.toDateString()===d.toDateString();});
          realData.push(dayOrders.reduce((s,o)=>s+o.total,0) + (extraBase[i]||40)*1000000);
        }
      } else if (tab==='month') {
        title='📈 Doanh thu theo tuần trong tháng'; tableTitle='Đơn hoàn tất tháng này';
        const weeks=['Tuần 1','Tuần 2','Tuần 3','Tuần 4'];
        for(let w=0;w<4;w++){
          labels.push(weeks[w]);
          const wOrders=orders.filter(o=>{const od=parseVNDate(o.date);const diff=Math.floor((today-od)/(86400000));return diff>=w*7&&diff<(w+1)*7;});
          realData.push(wOrders.reduce((s,o)=>s+o.total,0)+(extraBase[w+4]||50)*1000000*7);
        }
      } else {
        title='📈 Doanh thu 12 tháng năm 2026'; tableTitle='Đơn hoàn tất năm 2026';
        const months=['T1','T2','T3','T4','T5','T6','T7','T8','T9','T10','T11','T12'];
        months.forEach((m,i)=>{ labels.push(m); realData.push((extraBase[i]||45)*1000000*30); });
      }

      document.getElementById('chart-title').textContent = title;
      document.getElementById('table-title').textContent = tableTitle;

      const total = realData.reduce((s,v)=>s+v,0);
      const avg = Math.round(total/realData.length);
      const maxV = Math.max(...realData);
      document.getElementById('summary-cards').innerHTML = `
        <div class="stat-card"><div class="stat-icon">💰</div><div><div class="stat-label">Tổng doanh thu</div><div class="stat-value" style="font-size:1.1rem;">${formatPrice(total)}</div></div></div>
        <div class="stat-card"><div class="stat-icon">📊</div><div><div class="stat-label">Trung bình/${tab==='week'?'ngày':tab==='month'?'tuần':'tháng'}</div><div class="stat-value" style="font-size:1.1rem;">${formatPrice(avg)}</div></div></div>
        <div class="stat-card"><div class="stat-icon">🏆</div><div><div class="stat-label">Cao nhất</div><div class="stat-value" style="font-size:1.1rem;">${formatPrice(maxV)}</div></div></div>
        <div class="stat-card"><div class="stat-icon">📦</div><div><div class="stat-label">Đơn hoàn tất</div><div class="stat-value">${orders.length}</div></div></div>`;

      if (chart) chart.destroy();
      chart = new Chart(document.getElementById('revenueChart'), {
        type: 'line',
        data: { labels, datasets:[{ label:'Doanh thu (₫)', data:realData, backgroundColor:'rgba(255,179,102,0.15)', borderColor:'#FFB366', borderWidth:3, pointBackgroundColor:'#FFB366', pointRadius:5, fill:true, tension:0.3 }] },
        options: { responsive:true, plugins:{legend:{display:false}}, scales:{ y:{ ticks:{ callback:v=>(v/1000000).toFixed(0)+'tr' } } } }
      });

      const filtered = tab==='week' ? orders.filter(o=>{const d=parseVNDate(o.date);return (today-d)/86400000<=7;}) :
                       tab==='month' ? orders.filter(o=>{const d=parseVNDate(o.date);return (today-d)/86400000<=30;}) : orders;
      document.getElementById('rev-tbody').innerHTML = filtered.length
        ? filtered.map(o=>`<tr><td><strong>${o.id}</strong></td><td>${o.customer}</td><td style="font-size:0.82rem;">${o.items[0].emoji} ${o.items[0].name}${o.items.length>1?` +${o.items.length-1}`:''}</td><td><strong style="color:#2e7d32;">${formatPrice(o.total)}</strong></td><td>${o.date}</td></tr>`).join('')
        : '<tr><td colspan="5" style="text-align:center;color:#888;padding:24px;">Không có đơn hoàn tất trong kỳ</td></tr>';
    }

    renderRevenue('week');
  </script>
</body>
</html>
